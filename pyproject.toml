[project]
name = "spectest"
version = "0.1.0.dev0"
description = "A formal specification language and the tooling to test implementations against specs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Stef Lindall" }]
dependencies = [
    "hypothesis>=6.150",
    "pytest>=8",
    "gmpy2>=2.2",
    "bitpattern>=0.3",
]

[project.optional-dependencies]
examples = ["numpy>=2.1", "pandas>=2.2", "polars>=1.0"]

[project.entry-points.pytest11]
spectest = "spectest.pytest_plugin"

[dependency-groups]
dev = [
    "numpy>=2.1",
    "pandas>=2.2",
    "polars>=1.0",
    "pytest-xdist>=3.8.0",
    "ruff",
    "mojo-compiler==1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[project.scripts]
spectest = "spectest.cli:main"

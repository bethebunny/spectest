[project]
name = "pytest-spectest"
version = "0.0.1"
description = "A formal specification language and the tooling to test implementations against specs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stef Lindall" }]
keywords = ["specification", "formal specification", "property-based testing", "pytest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "hypothesis>=6.150",
    "pytest>=8",
    "gmpy2>=2.2",
    "bitpattern>=0.3",
    # The Mojo runtime libraries the extension module loads. 1.2.0 is the release it is
    # built with, and no later release exists to check its runtime symbols against.
    "mojo-compiler==1.2.0",
]

[project.optional-dependencies]
examples = ["numpy>=2.1", "pandas>=2.2", "polars>=1.0"]

[project.urls]
Source = "https://github.com/bethebunny/spectest"
Issues = "https://github.com/bethebunny/spectest/issues"

[project.entry-points.pytest11]
spectest = "spectest.pytest_plugin"

[dependency-groups]
dev = [
    "numpy>=2.1",
    "pandas>=2.2",
    "polars>=1.0",
    "pytest-xdist>=3.8.0",
    "ruff",
]

[build-system]
requires = ["hatchling", "mojo-compiler==1.2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spectest"]
exclude = ["*.mojo"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist]
exclude = [".jj"]  # hatchling only skips .git

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[project.scripts]
spectest = "spectest.cli:main"
